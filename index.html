<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>过山车公园 · 3D 场景</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "PingFang SC", system-ui, -apple-system, sans-serif;
        background: #030711;
        color: #f2f5f9;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header,
      footer {
        padding: 0.9rem 1.4rem;
        background: rgba(2, 4, 12, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      footer {
        margin-top: auto;
        border-bottom: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.55);
        font-size: 0.9rem;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        padding: 1rem;
      }

      #viewport {
        width: 100%;
        max-height: calc(100vh - 220px);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: radial-gradient(circle at top, #14223d, #050a12 65%);
        display: block;
        touch-action: none;
        cursor: grab;
      }

      #viewport.dragging {
        cursor: grabbing;
      }

      .panel {
        background: rgba(7, 11, 22, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 1rem 1.2rem;
        line-height: 1.6;
      }

      .info-line {
        display: flex;
        flex-wrap: wrap;
        gap: 0.8rem;
        font-size: 0.95rem;
        color: rgba(255, 255, 255, 0.8);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.1rem 0.5rem;
        border-radius: 8px;
        background: rgba(56, 178, 92, 0.15);
        color: #3ccf85;
        font-weight: 600;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>过山车公园总览 (WebGL2)</h1>
      <div class="info-line">
        <span>核心地块：<strong>60 m × 60 m</strong>（免购）</span>
        <span>扩展区：逐层解锁木栅栏外格</span>
        <span>模式：第三视角跟随 · 默认 45°/8 m</span>
        <span>视角：鼠标拖拽旋转 · 滚轮/双指缩放</span>
        <span>移动：WASD / 方向键</span>
        <span>点击扩展格可购买 / 点击地块可建站台</span>
      </div>
    </header>
    <main>
      <canvas id="viewport"></canvas>
      <section class="panel">
        <h2>扩展区购买状态</h2>
        <p id="status">尚未进行任何购买。</p>
        <div class="info-line">
          <span>剩余扩展格：<strong id="remaining">--</strong></span>
          <span class="badge">已购：<span id="purchased">0</span></span>
        </div>
      </section>
    </main>
    <footer>使用 WebGL2 与程序化材质渲染 3D 棋盘草地与木栅栏。</footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
