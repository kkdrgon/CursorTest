<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>WebGL2 过山车公园</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="hud">
      <section class="panel">
        <header>过山车公园</header>
        <div class="stat">资金：<span id="moneyLabel">0</span></div>
        <div class="stat">公园范围：<span id="parkSizeLabel">0 x 0</span></div>
        <div class="stat">模式：<span id="modeLabel">空闲</span></div>
        <div class="actions">
          <button id="buyStationBtn">购买站台 (¥500)</button>
          <button id="buyTileBtn">购买格子 1m² (¥200)</button>
          <button id="cancelBtn">取消当前操作</button>
        </div>
      </section>

      <section class="panel">
        <header>轨道参数</header>
        <div id="selectionInfo" class="muted">点击站台进入建造模式</div>
        <div id="trackForm" class="hidden">
          <div class="section">
            <div class="section-header">当前站台：<span id="stationName"></span></div>
            <div class="sub-panel">
              <div class="sub-header">轨道单元库</div>
              <label>单元名称
                <input id="moduleName" type="text" placeholder="例：直线10m" />
              </label>
              <label>类型
                <select id="moduleType">
                  <option value="straight">直线</option>
                  <option value="arc">圆弧</option>
                  <option value="bezier">贝塞尔</option>
                </select>
              </label>
              <div id="straightFields" class="module-fields">
                <label>长度 (m)
                  <input id="straightLength" type="number" step="0.5" value="10" min="0.5" />
                </label>
                <label>升降 (m)
                  <input id="straightRise" type="number" step="0.5" value="0" />
                </label>
              </div>
              <div id="arcFields" class="module-fields hidden">
                <label>半径 (m)
                  <input id="arcRadius" type="number" step="0.5" value="12" min="1" />
                </label>
                <label>弧角 (°)
                  <input id="arcModuleAngle" type="number" step="5" value="45" min="5" max="360" />
                </label>
                <label>方向
                  <select id="arcModuleDirection">
                    <option value="1">逆时针</option>
                    <option value="-1">顺时针</option>
                  </select>
                </label>
                <label>升降 (m)
                  <input id="arcRise" type="number" step="0.5" value="0" />
                </label>
              </div>
              <div id="bezierFields" class="module-fields hidden">
                <p class="muted small">控制点以当前轨道朝向为局部坐标，单位米。</p>
                <div class="bezier-grid">
                  <label>CP1 X<input id="bz1x" type="number" step="0.5" value="5" /></label>
                  <label>CP1 Y<input id="bz1y" type="number" step="0.5" value="0" /></label>
                  <label>CP1 Z<input id="bz1z" type="number" step="0.5" value="2" /></label>
                  <label>CP2 X<input id="bz2x" type="number" step="0.5" value="10" /></label>
                  <label>CP2 Y<input id="bz2y" type="number" step="0.5" value="0" /></label>
                  <label>CP2 Z<input id="bz2z" type="number" step="0.5" value="-2" /></label>
                  <label>CP3 X<input id="bz3x" type="number" step="0.5" value="15" /></label>
                  <label>CP3 Y<input id="bz3y" type="number" step="0.5" value="0" /></label>
                  <label>CP3 Z<input id="bz3z" type="number" step="0.5" value="0" /></label>
                </div>
              </div>
              <div class="actions stacked">
                <button id="saveModuleBtn">保存/更新单元</button>
                <button id="resetModuleBtn" class="secondary">清空编辑</button>
              </div>
            </div>

            <div class="sub-panel">
              <div class="sub-header">搭建轨道</div>
              <label>可用单元
                <select id="moduleLibrarySelect"></select>
              </label>
              <div class="actions stacked">
                <button id="loadModuleBtn" class="secondary">载入到编辑器</button>
                <button id="addModuleBtn">添加到轨道</button>
              </div>
              <div id="trackStatus" class="muted"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <header>操作提示</header>
        <ul>
          <li>拖拽鼠标旋转视角，滚轮缩放。</li>
          <li>点击“购买站台”后在地面单击放置。</li>
          <li>点击站台进入建造模式，提交表单添加轨道。</li>
          <li>初始公园为 60m × 60m，格子单位 1m × 1m。</li>
          <li>切换到“购买格子”模式，点击地面可扩展公园。</li>
        </ul>
      </section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
