<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>WebGL2 过山车公园</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="hud">
      <section class="panel">
        <header>过山车公园</header>
        <div class="stat">资金：<span id="moneyLabel">0</span></div>
        <div class="stat">公园范围：<span id="parkSizeLabel">0 x 0</span></div>
        <div class="stat">模式：<span id="modeLabel">空闲</span></div>
        <div class="actions">
          <button id="buyStationBtn">购买站台 (¥500)</button>
          <button id="buyTileBtn">购买格子 1m² (¥200)</button>
          <button id="cancelBtn">取消当前操作</button>
        </div>
        <label>站台长度 (10-30 m)
          <input
            id="stationLengthInput"
            type="number"
            min="10"
            max="30"
            step="0.5"
            value="12"
          />
        </label>
      </section>

      <section class="panel">
        <header>轨道参数</header>
        <div id="selectionInfo" class="muted">点击站台进入建造模式</div>
        <div id="trackForm" class="hidden">
          <div>当前站台：<span id="stationName"></span></div>
          <label>段类型
            <select id="segmentType">
              <option value="arc">空间圆弧</option>
              <option value="bezier">贝塞尔</option>
            </select>
          </label>
          <div id="arcSegmentFields" class="segment-fields">
            <label>模式
              <select id="arcMode">
                <option value="projected">平面投影</option>
                <option value="free">自定义平面</option>
              </select>
            </label>
            <label>半径 (m)
              <input id="arcRadiusParam" type="number" step="0.5" value="12" min="1" />
            </label>
            <label>弧角 (°)
              <input id="arcSweepParam" type="number" step="5" value="60" min="5" max="360" />
            </label>
            <label>方向
              <select id="arcDirectionParam">
                <option value="1">逆时针</option>
                <option value="-1">顺时针</option>
              </select>
            </label>
            <label>终点升降 (m)
              <input id="arcRiseParam" type="number" step="0.5" value="0" />
            </label>
            <label>倾斜 (°)
              <input id="arcBankParam" type="number" step="1" value="0" />
            </label>
            <div id="arcPlaneFields" class="module-fields hidden">
              <p class="muted small">自定义平面的法向量：</p>
              <div class="bezier-grid">
                <label>n_x<input id="planeNx" type="number" step="0.1" value="0" /></label>
                <label>n_y<input id="planeNy" type="number" step="0.1" value="1" /></label>
                <label>n_z<input id="planeNz" type="number" step="0.1" value="0" /></label>
              </div>
            </div>
          </div>
          <div id="bezierSegmentFields" class="segment-fields hidden">
            <p class="muted small">控制点使用段起点局部坐标 (前/上/右)，单位：米。</p>
            <div class="bezier-grid">
              <label>CP1 X<input id="segBz1x" type="number" step="0.5" value="5" /></label>
              <label>CP1 Y<input id="segBz1y" type="number" step="0.5" value="0" /></label>
              <label>CP1 Z<input id="segBz1z" type="number" step="0.5" value="2" /></label>
              <label>CP2 X<input id="segBz2x" type="number" step="0.5" value="10" /></label>
              <label>CP2 Y<input id="segBz2y" type="number" step="0.5" value="0" /></label>
              <label>CP2 Z<input id="segBz2z" type="number" step="0.5" value="-2" /></label>
              <label>CP3 X<input id="segBz3x" type="number" step="0.5" value="15" /></label>
              <label>CP3 Y<input id="segBz3y" type="number" step="0.5" value="0" /></label>
              <label>CP3 Z<input id="segBz3z" type="number" step="0.5" value="0" /></label>
            </div>
          </div>
          <div class="actions stacked">
            <button id="applySegmentBtn">添加段</button>
            <button id="updateSegmentBtn" class="secondary hidden">更新当前段</button>
            <button id="resetSegmentBtn" class="ghost">清空表单</button>
          </div>
          <div class="sub-panel list-panel">
            <div class="sub-header">当前轨道</div>
            <ul id="segmentList" class="module-stack muted small">
              <li>暂无轨道段</li>
            </ul>
          </div>
          <div id="trackStatus" class="muted"></div>
        </div>
      </section>

      <section class="panel">
        <header>操作提示</header>
        <ul>
          <li>拖拽鼠标旋转视角，滚轮缩放。</li>
          <li>点击“购买站台”后在地面单击放置。</li>
          <li>点击站台进入建造模式，提交表单添加轨道。</li>
          <li>初始公园为 60m × 60m，格子单位 1m × 1m。</li>
          <li>切换到“购买格子”模式，点击地面可扩展公园。</li>
        </ul>
      </section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
