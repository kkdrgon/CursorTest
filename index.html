<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <title>WebGL2 过山车公园</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="glcanvas"></canvas>
    <div id="hud">
      <section class="panel">
        <header>过山车公园</header>
        <div class="stat">资金：<span id="moneyLabel">0</span></div>
        <div class="stat">模式：<span id="modeLabel">空闲</span></div>
        <div class="actions">
          <button id="buyStationBtn">购买站台 (¥500)</button>
          <button id="cancelBtn">取消当前操作</button>
        </div>
      </section>

      <section class="panel">
        <header>轨道参数</header>
        <div id="selectionInfo" class="muted">点击站台进入建造模式</div>
        <div id="trackForm" class="hidden">
          <div>当前站台：<span id="stationName"></span></div>
          <label>弧角 (°)
            <input id="arcAngle" type="number" step="5" value="45" min="10" max="270" />
          </label>
          <label>方向
            <select id="arcDirection">
              <option value="1">逆时针</option>
              <option value="-1">顺时针</option>
            </select>
          </label>
          <label>高度
            <input id="segmentHeight" type="number" step="0.5" value="2.5" min="0.5" max="10" />
          </label>
          <label>内径 (底面)
            <input id="innerBottom" type="number" step="0.5" value="4" min="1" />
          </label>
          <label>外径 (底面)
            <input id="outerBottom" type="number" step="0.5" value="6" min="2" />
          </label>
          <label>内径 (顶面)
            <input id="innerTop" type="number" step="0.5" value="4" min="0.5" />
          </label>
          <label>外径 (顶面)
            <input id="outerTop" type="number" step="0.5" value="6" min="1" />
          </label>
          <label>细分
            <input id="subdivisions" type="number" min="4" max="64" value="24" />
          </label>
          <button id="addTrackBtn">添加轨道段</button>
          <div id="trackStatus" class="muted"></div>
        </div>
      </section>

      <section class="panel">
        <header>操作提示</header>
        <ul>
          <li>拖拽鼠标旋转视角，滚轮缩放。</li>
          <li>点击“购买站台”后在地面单击放置。</li>
          <li>点击站台进入建造模式，提交表单添加轨道。</li>
        </ul>
      </section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
