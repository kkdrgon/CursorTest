<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WebGL2 3D 推箱子示例</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
    }
    #glcanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    button {
      margin-top: 6px;
      padding: 4px 10px;
      border-radius: 4px;
      border: none;
      background: #2a7ae2;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #3c8cf0;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="status">WASD / 方向键 移动；将所有箱子推到黄色目标点上以通关。</div>
    <div style="margin-top: 6px; display: flex; gap: 6px; align-items: center;">
      <label for="levelSelect" style="font-size: 12px;">关卡:</label>
      <select id="levelSelect" style="padding: 2px 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #eee; font-size: 12px;">
        <option value="0">加载中...</option>
      </select>
      <span id="levelInfo" style="font-size: 12px; margin-left: 4px;">-</span>
    </div>
    <button id="resetBtn">重置关卡</button>
    <button id="generateBtn">生成新关卡</button>
  </div>
  <canvas id="glcanvas"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
