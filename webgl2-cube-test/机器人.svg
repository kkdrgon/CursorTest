  <rect x="410" y="560" width="60" height="30" fill="#707070"/>
  
  <!-- 文字 -->
  <text x="400" y="720" font-family="Arial" font-size="40" font-weight="bold" text-anchor="middle" fill="#FFFFFF" stroke="#000000" stroke-width="2">机器人</text>
