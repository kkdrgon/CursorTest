<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>椭圆岛地图原型 · HTML + JS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="canvas-panel" aria-label="地图画布">
        <canvas
          id="mapCanvas"
          width="1200"
          height="900"
          aria-label="椭圆岛俯视示意"
        >
          您的浏览器不支持 Canvas。
        </canvas>
        <div class="hint-layer">
          点击画布可以重新设置弓箭发射起点。
        </div>
      </section>
      <section class="side-panel" id="sidePanel">
        <header class="panel-header">
          <h1>椭圆岛调试台</h1>
          <p>8v8 弓箭手地图 · 地形/碰撞/抛物线演示</p>
          <button type="button" id="panelToggle" class="panel-toggle" aria-expanded="true">
            折叠面板
          </button>
        </header>

        <div id="infoPanel" class="info-panel">
          <h2>实时状态</h2>
          <div class="info-grid">
            <div>
              <span class="label">技能</span>
              <span id="abilityInfo" class="value">-</span>
            </div>
            <div>
              <span class="label">发射点</span>
              <span id="originInfo" class="value">-</span>
            </div>
            <div>
              <span class="label">命中层</span>
              <span id="impactLayer" class="value">-</span>
            </div>
            <div>
              <span class="label">命中坐标</span>
              <span id="impactCoords" class="value">-</span>
            </div>
            <div>
              <span class="label">描述</span>
              <span id="impactDescription" class="value">-</span>
            </div>
          </div>
        </div>

        <form id="controls" class="controls" autocomplete="off">
          <fieldset>
            <legend>图层开关</legend>
            <label>
              <input type="checkbox" data-layer="terrain" checked />
              地形
            </label>
            <label>
              <input type="checkbox" data-layer="zones" checked />
              分区
            </label>
            <label>
              <input type="checkbox" data-layer="paths" checked />
              路径
            </label>
            <label>
              <input type="checkbox" data-layer="obstacles" checked />
              障碍
            </label>
            <label>
              <input type="checkbox" data-layer="collision" checked />
              碰撞/轨迹
            </label>
          </fieldset>

          <fieldset>
            <legend>抛物线沙盒</legend>
            <label class="full-width">
              技能
              <select id="abilitySelect"></select>
            </label>
            <label data-input="speed">
              初速度 (m/s)
              <input type="number" id="speedInput" min="5" max="120" step="1" value="55" />
            </label>
            <label data-input="pitch">
              仰角 (°)
              <input type="number" id="pitchInput" min="5" max="80" step="1" value="38" />
            </label>
            <label data-input="yaw">
              方位角 (°)
              <input type="number" id="yawInput" min="-180" max="180" step="1" value="0" />
            </label>
            <label data-input="distance">
              目标距离 (m)
              <input type="number" id="distanceInput" min="1" max="200" step="1" value="40" />
            </label>
            <div class="button-row">
              <button type="button" id="fireBtn">发射箭矢</button>
              <button type="button" id="resetTrajectoryBtn" class="ghost">
                清除轨迹
              </button>
            </div>
          </fieldset>

          <fieldset>
            <legend>刷点调试</legend>
            <p>当前展示随机组合的 4 个刷点（每队 2 个）。</p>
            <div class="button-row">
              <button type="button" id="shuffleSpawnsBtn">切换组合</button>
            </div>
          </fieldset>
        </form>

        <section class="log">
          <h2>事件记录</h2>
          <div id="eventLog" aria-live="polite"></div>
        </section>
      </section>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
